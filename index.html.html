<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7ff"><title>에세이 암기 트레이너</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#18243b;background:#f5f7ff}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:22px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}p{line-height:1.6}.sub{color:#65738a;font-size:13px;margin:8px 0 20px}.panel{background:white;border:1px solid #e3e8f4;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 5px 22px #1e3b7010}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{padding:12px 7px;border:0;border-radius:12px;background:#edf1fa;color:#40506a;font-weight:750}.tab.active{background:#4f58d8;color:white}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:750;color:#43536d;display:block;margin-bottom:7px}select,input[type=range]{width:100%}select{border:1px solid #cdd5e7;border-radius:12px;padding:11px;background:#fff;font-size:15px}.range{display:flex;align-items:center;gap:12px}.range input{flex:1}.pill{background:#e8eafd;color:#4448b9;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:750}.progress{height:9px;background:#e9edf7;border-radius:30px;overflow:hidden;margin:13px 0}.bar{height:100%;background:#6266e9;transition:width .2s}.meta{display:flex;justify-content:space-between;align-items:center;color:#64738d;font-size:13px;gap:8px}.sentence{font-size:21px;line-height:2.2;word-break:normal;margin:18px 0}.blank{display:inline-block;vertical-align:baseline;min-width:70px;width:var(--bw,90px);max-width:190px;border:0;border-bottom:2px solid #787deb;border-radius:0;background:#f0f1ff;color:#232e59;font:inherit;font-size:18px;padding:3px 6px;text-align:center;margin:0 3px;outline-offset:2px}.blank.ok{background:#e6f7ec;border-color:#29a86a}.blank.bad{background:#fff0ef;border-color:#db5955}.hint{color:#7c87a0;font-size:13px}.translation{background:#f6f8fd;border-radius:12px;padding:12px 14px;color:#43516a;line-height:1.6}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{cursor:pointer;touch-action:manipulation}.btn{border:0;border-radius:13px;padding:13px 17px;background:#e9edf9;color:#27324a;font-size:15px;font-weight:750}.primary{background:#505adf;color:white}.good{color:#168451}.badtext{color:#bb4242}.feedback{min-height:27px;margin-top:13px;font-size:14px;font-weight:700}.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.token{border:1px solid #cbd2ea;background:#fff;border-radius:12px;padding:10px 12px;font-size:15px}.token.selected{background:#565ddd;color:#fff;border-color:#565ddd}.token.used{opacity:.32}.answerzone{min-height:65px;border:2px dashed #cbd3e7;border-radius:13px;padding:10px;display:flex;flex-wrap:wrap;gap:7px}.answerzone .token{background:#e8eaff;border-color:#d0d3fb}.stat{display:flex;gap:8px;flex-wrap:wrap}.stat span{background:#edf0fc;border-radius:9px;padding:8px;font-size:12px}.hidden{display:none!important}.small{font-size:12px;color:#7a859b}.full{white-space:pre-wrap;line-height:1.9;font-size:15px}.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#4e5c74}.switch input{accent-color:#555de0}.ref{border-left:3px solid #abb0e8;padding-left:10px;margin:15px 0} @media(max-width:550px){main{padding:17px 12px 70px}h1{font-size:22px}.panel{padding:16px}.sentence{font-size:18px;line-height:2.25}.blank{font-size:16px;min-width:55px}.controls{grid-template-columns:1fr}.btn{padding:12px}.token{padding:9px}}
</style></head><body><main><div class="top"><h1>📘 에세이 암기 트레이너</h1><span class="pill">오프라인 가능</span></div><p class="sub">항생제 내성과 의학의 미래 · 20문장 · 원문 그대로</p>
<div class="panel"><div class="tabs"><button class="tab active" data-mode="blank">✏️ 빈칸 채우기</button><button class="tab" data-mode="scramble">🧩 단어 스크램블</button><button class="tab" data-mode="read">📖 전체 원문</button></div></div>
<div id="study"><div class="panel"><div class="controls"><div><label for="section">학습 범위</label><select id="section"><option value="all">전체 문장</option><option value="서론">① 서론</option><option value="본론 1 · 항생제 오남용">② 본론 1</option><option value="본론 2 · 신약 개발">③ 본론 2</option><option value="결론">④ 결론</option><option value="wrong">⭐ 오답만 복습</option></select></div><div><label for="difficulty">빈칸 난이도 <span id="pct" class="pill">20%</span></label><div class="range"><input id="difficulty" type="range" min="10" max="100" step="10" value="20"></div></div></div><div class="btns"><label class="switch"><input type="checkbox" id="auto" checked> 정답을 맞히면 빈칸 자동 증가</label><label class="switch"><input type="checkbox" id="korean" checked> 한글 해석 표시</label></div><p class="small">빈칸은 10~100% 조절 가능 · 자동 모드에서는 정답 3개마다 10% 증가 · 스크램블은 단어를 눌러 문장을 완성해요.</p></div>
<div class="panel"><div class="meta"><strong id="sectionname"></strong><span id="count"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="task"></div><div id="ko" class="translation"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="btns"><button id="check" class="btn primary">정답 확인</button><button id="hint" class="btn">힌트</button><button id="reveal" class="btn">정답 보기</button><button id="next" class="btn">다음 문장 →</button></div></div><div class="panel"><div class="stat" id="stats"></div><div class="btns"><button class="btn" id="restart">처음부터 다시</button><button class="btn" id="reset">기록 초기화</button></div></div></div>
<div id="reading" class="panel hidden"><h2>영어 원문 전체</h2><label class="switch"><input type="checkbox" id="readko"> 한글 해석 함께 보기</label><div id="full" class="full"></div><div class="btns"><button class="btn" id="copy">영어 원문 복사</button></div></div>
</main><script>const DATA=[{"section": "서론", "en": "One of the most important issues that our future society will face is antibiotic resistance.", "ko": "미래 사회가 직면하게 될 가장 중요한 문제 중 하나는 항생제 내성이다."}, {"section": "서론", "en": "Antibiotics treat bacterial infections, but two problems threaten their future use: the misuse of antibiotics and the lack of new drugs.", "ko": "항생제는 세균 감염을 치료하지만, 항생제 오용과 신약 부족이라는 두 가지 문제가 미래의 항생제 사용을 위협한다."}, {"section": "서론", "en": "These problems can make infections harder to treat and harm our communities.", "ko": "이 문제들은 감염병 치료를 어렵게 하고 공동체에 피해를 줄 수 있다."}, {"section": "서론", "en": "This matters because even common infections may become serious when available medicines no longer work well.", "ko": "기존 약물이 효과를 잃으면 흔한 감염병도 심각해질 수 있기 때문에 중요하다."}, {"section": "본론 1 · 항생제 오남용", "en": "First, antibiotic resistance is partly caused by the misuse and overuse of antibiotics.", "ko": "첫째, 항생제 내성은 부분적으로 항생제 오용과 남용 때문에 발생한다."}, {"section": "본론 1 · 항생제 오남용", "en": "When antibiotics are used too often or when they are not needed, resistant bacteria can survive and spread.", "ko": "항생제를 너무 자주 또는 불필요하게 사용하면 내성균이 살아남아 퍼질 수 있다."}, {"section": "본론 1 · 항생제 오남용", "en": "According to the World Health Organization (WHO), misuse and overuse help drug-resistant bacteria spread.", "ko": "세계보건기구에 따르면 오용과 남용은 약제내성균 확산을 촉진한다."}, {"section": "본론 1 · 항생제 오남용", "en": "This can lead to longer illnesses and more difficult treatments.", "ko": "이는 질병을 더 오래 지속시키고 치료를 어렵게 할 수 있다."}, {"section": "본론 1 · 항생제 오남용", "en": "To solve this problem, governments should introduce better rules for antibiotic use.", "ko": "이를 해결하려면 정부는 항생제 사용 규정을 개선해야 한다."}, {"section": "본론 1 · 항생제 오남용", "en": "Hospitals should check whether patients need antibiotics before prescribing them.", "ko": "병원은 처방 전 환자에게 항생제가 필요한지 확인해야 한다."}, {"section": "본론 1 · 항생제 오남용", "en": "Schools should also teach students that antibiotics do not work against viruses.", "ko": "학교도 항생제가 바이러스에는 효과가 없다는 사실을 가르쳐야 한다."}, {"section": "본론 2 · 신약 개발", "en": "Moreover, developing new antibiotics is difficult and expensive.", "ko": "더욱이 새 항생제 개발은 어렵고 비용이 많이 든다."}, {"section": "본론 2 · 신약 개발", "en": "Companies may earn less money from antibiotics because these drugs should be used carefully.", "ko": "항생제는 신중히 사용해야 하므로 기업이 얻는 수익이 적을 수 있다."}, {"section": "본론 2 · 신약 개발", "en": "As a result, some companies may avoid this research.", "ko": "그 결과 일부 기업은 이러한 연구를 꺼릴 수 있다."}, {"section": "본론 2 · 신약 개발", "en": "A 2025 WHO report found that the antibiotics being developed are not enough to fight growing resistance.", "ko": "2025년 WHO 보고서는 개발 중인 항생제만으로 증가하는 내성에 대응하기에 부족하다고 밝혔다."}, {"section": "본론 2 · 신약 개발", "en": "Therefore, governments should increase research funding and support companies developing new antibiotics.", "ko": "따라서 정부는 연구비를 늘리고 새 항생제를 개발하는 기업을 지원해야 한다."}, {"section": "본론 2 · 신약 개발", "en": "They should also encourage universities and drug companies to work together and share research results.", "ko": "또한 대학과 제약회사의 협력과 연구 결과 공유를 장려해야 한다."}, {"section": "결론", "en": "In conclusion, careful antibiotic use can slow the spread of resistant bacteria.", "ko": "결론적으로 신중한 항생제 사용은 내성균 확산을 늦출 수 있다."}, {"section": "결론", "en": "More support for research can help create new treatments.", "ko": "연구 지원 확대는 새로운 치료법 개발에 도움이 될 수 있다."}, {"section": "결론", "en": "Together, these policies can build a healthier society where people can receive effective treatment when they need it.", "ko": "이 정책들은 필요할 때 효과적인 치료를 받을 수 있는 더 건강한 사회를 만드는 데 기여할 수 있다."}];const KEY='essay-memory-antibiotics-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}let state={mode:'blank',index:0,correct:0,attempts:0,streak:0,wrong:new Set(saved.wrong||[]),done:new Set(saved.done||[]),hint:0,shown:false,order:[],selected:[],blanks:[],pool:[],seed:0};const $=id=>document.getElementById(id);const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({wrong:[...state.wrong],done:[...state.done]}))}catch{}};const words=s=>s.match(/\S+/g)||[];const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pool(){let s=$('section').value;return DATA.map((d,i)=>i).filter(i=>s==='all'||(s==='wrong'?state.wrong.has(i):DATA[i].section===s))}function current(){let p=pool();return p.length? p[state.index%p.length]:null}function show(){let i=current();$('sectionname').textContent=i===null?'복습할 문장이 없어요':DATA[i].section;$('count').textContent=i===null?'0 / 0':`${state.index%pool().length+1} / ${pool().length}`;$('bar').style.width=i===null?'0%':`${(state.index%pool().length+1)/pool().length*100}%`;$('feedback').textContent='';state.shown=false;state.hint=0;state.selected=[];state.seed++;if(i===null){$('task').innerHTML='<p>아직 틀린 문장이 없어요. 전체 문장으로 연습해 보세요.</p>';$('ko').textContent='';return}let d=DATA[i];$('ko').textContent=d.ko;$('ko').classList.toggle('hidden',!$('korean').checked);if(state.mode==='blank')renderBlank(d);else renderScramble(d);renderStats()}function renderBlank(d){let w=words(d.en),ratio=+$('difficulty').value/100,need=Math.max(1,Math.round(w.length*ratio));let eligible=w.map((x,i)=>i).filter(i=>/[a-z]/i.test(w[i]));let picked=shuffle(eligible).slice(0,Math.min(need,eligible.length));state.blanks=picked.sort((a,b)=>a-b);let h=w.map((word,i)=>state.blanks.includes(i)?`<input class="blank" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${i+1}번째 단어" style="--bw:${Math.min(170,Math.max(62,word.length*11))}px">`:`<span>${esc(word)}</span>`).join(' ');$('task').innerHTML=`<p class="hint">빈칸에 알맞은 영어 단어를 입력하세요. 구두점은 생략해도 돼요.</p><div class="sentence">${h}</div>`;let inputs=[...document.querySelectorAll('.blank')];inputs.forEach((x,k)=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(k<inputs.length-1)inputs[k+1].focus();else check()}}))}function renderScramble(d){let w=words(d.en);state.order=w;state.pool=shuffle(w.map((word,id)=>({word,id})));if(state.pool.every((x,i)=>x.id===i))state.pool.reverse();$('task').innerHTML='<p class="hint">아래 단어를 순서대로 눌러 문장을 완성하세요. 선택한 단어를 누르면 취소할 수 있어요.</p><div class="answerzone" id="answerzone"></div><div class="tokens" id="tokens"></div>';renderTokens()}function renderTokens(){let used=new Set(state.selected);$('tokens').innerHTML=state.pool.map(t=>`<button class="token ${used.has(t.id)?'used':''}" ${used.has(t.id)?'disabled':''} data-token="${t.id}">${esc(t.word)}</button>`).join('');$('answerzone').innerHTML=state.selected.map((id,k)=>`<button class="token selected" data-remove="${k}">${esc(state.order[id])}</button>`).join('');document.querySelectorAll('[data-token]').forEach(el=>el.onclick=()=>{state.selected.push(+el.dataset.token);renderTokens()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{state.selected.splice(+el.dataset.remove,1);renderTokens()})}function check(){let i=current();if(i===null)return;let ok=false;if(state.mode==='blank'){let ins=[...document.querySelectorAll('.blank')];ok=ins.every(x=>norm(x.value)===norm(words(DATA[i].en)[+x.dataset.i]));ins.forEach(x=>x.classList.toggle('ok',norm(x.value)===norm(words(DATA[i].en)[+x.dataset.i])));ins.forEach(x=>x.classList.toggle('bad',norm(x.value)!==norm(words(DATA[i].en)[+x.dataset.i])))}else{ok=state.selected.length===state.order.length&&state.selected.every((id,k)=>norm(state.order[id])===norm(state.order[k]));}state.attempts++;if(ok){state.correct++;state.streak++;state.done.add(i);state.wrong.delete(i);$('feedback').innerHTML='<span class="good">✓ 정답이에요! 다음 문장으로 넘어가세요.</span>';if($('auto').checked&&state.streak%3===0&&+$('difficulty').value<100){$('difficulty').value=+$('difficulty').value+10;syncPct();$('feedback').innerHTML+=' <span class="pill">다음부터 빈칸 +10%</span>'}}else{state.streak=0;state.wrong.add(i);$('feedback').innerHTML='<span class="badtext">아직 정답이 아니에요. 다시 시도하거나 힌트를 눌러 보세요.</span>'}persist();renderStats()}function hint(){let i=current();if(i===null)return;if(state.mode==='blank'){let ins=[...document.querySelectorAll('.blank')],w=words(DATA[i].en);let x=ins.find(el=>norm(el.value)!==norm(w[+el.dataset.i]));if(x){let target=w[+x.dataset.i].replace(/[^A-Za-z]/g,'');x.placeholder=target.slice(0,Math.min(target.length,++state.hint));x.focus()}}else{$('feedback').textContent=`힌트: ${state.order.slice(0,Math.min(state.order.length,++state.hint)).join(' ')}`}}function reveal(){let i=current();if(i===null)return;state.wrong.add(i);state.streak=0;persist();if(state.mode==='blank'){let w=words(DATA[i].en);document.querySelectorAll('.blank').forEach(x=>{x.value=w[+x.dataset.i];x.classList.add('ok')})}else{$('answerzone').innerHTML=state.order.map(x=>`<span class="token selected">${esc(x)}</span>`).join('');$('tokens').innerHTML=''}$('feedback').innerHTML='<span class="hint">정답을 확인했어요. 이 문장은 오답 복습에 저장돼요.</span>';renderStats()}function renderStats(){$('stats').innerHTML=`<span>맞힌 횟수 ${state.correct}</span><span>연속 정답 ${state.streak}</span><span>완료한 문장 ${state.done.size} / ${DATA.length}</span><span>오답 복습 ${state.wrong.size}문장</span>`}function syncPct(){$('pct').textContent=$('difficulty').value+'%'}function switchMode(mode){state.mode=mode;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('study').classList.toggle('hidden',mode==='read');$('reading').classList.toggle('hidden',mode!=='read');if(mode==='read')renderReading();else show()}function renderReading(){let out='',last='';DATA.forEach(d=>{if(d.section!==last){last=d.section;out+=`<h2 style="margin-top:25px">${esc(last)}</h2>`}out+=`<p class="ref">${esc(d.en)}${$('readko').checked?`<span style="display:block;color:#6b7890;margin-top:5px">${esc(d.ko)}</span>`:''}</p>`});$('full').innerHTML=out}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));$('check').onclick=check;$('hint').onclick=hint;$('reveal').onclick=reveal;$('next').onclick=()=>{state.index++;show()};$('difficulty').oninput=()=>{syncPct();if(state.mode==='blank')show()};$('section').onchange=()=>{state.index=0;show()};$('korean').onchange=()=>{$('ko').classList.toggle('hidden',!$('korean').checked)};$('readko').onchange=renderReading;$('restart').onclick=()=>{state.index=0;state.correct=0;state.attempts=0;state.streak=0;$('difficulty').value=20;syncPct();show()};$('reset').onclick=()=>{if(confirm('학습 기록과 오답 목록을 모두 지울까요?')){state.done.clear();state.wrong.clear();persist();$('section').value='all';$('restart').click()}};$('copy').onclick=async()=>{let t=DATA.map(d=>d.en).join('\n');try{await navigator.clipboard.writeText(t);alert('영어 원문을 복사했어요.')}catch{let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('복사했어요.')}};syncPct();show();</script></body></html>
